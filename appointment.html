<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>นัดหมายเปลี่ยน Notebook | IT Support</title>
  <meta name="description" content="ระบบนัดหมายเปลี่ยน Notebook — ค้นหาชื่อและเลือกวัน-เวลาที่สะดวก" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary:#2563eb;--primary-dark:#1d4ed8;
      --success:#10b981;--warning:#f59e0b;
      --indigo:#6366f1;--indigo-dark:#4f46e5;
      --text:#1e293b;--text-muted:#64748b;
      --card-bg:rgba(255,255,255,0.92);
      --border:rgba(255,255,255,0.6);
      --shadow:0 4px 24px rgba(37,99,235,0.08);
      --radius:16px;--font:'Sarabun','Inter',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--font);background:linear-gradient(135deg,#f0f4ff 0%,#e8f0fe 50%,#f0e8ff 100%);min-height:100vh;color:var(--text);}

    /* NAV */
    .nav{background:rgba(255,255,255,0.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.6);position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(37,99,235,0.07);}
    .nav-inner{max-width:1320px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;height:64px;gap:1rem;}
    .nav-logo{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:var(--text);}
    .nav-logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .nav-title{font-size:.95rem;font-weight:700;line-height:1.2;}
    .nav-subtitle{font-size:.7rem;color:var(--text-muted);}
    .nav-links{display:flex;gap:.375rem;margin-left:auto;}
    .nav-link{padding:.5rem .875rem;border-radius:8px;text-decoration:none;font-size:.825rem;font-weight:500;color:var(--text-muted);transition:all .2s;}
    .nav-link:hover{background:#f1f5f9;color:var(--primary);}
    .nav-link.active{background:#eff6ff;color:var(--primary);font-weight:600;}

    /* LAYOUT */
    .container{max-width:720px;margin:0 auto;padding:2rem 1.5rem;}
    .page-header{text-align:center;margin-bottom:2rem;}
    .page-title{font-size:1.75rem;font-weight:800;margin-bottom:.5rem;}
    .page-subtitle{font-size:.9rem;color:var(--text-muted);}

    /* SEARCH CARD */
    .search-card{background:var(--card-bg);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;box-shadow:var(--shadow);margin-bottom:1.5rem;}
    .search-label{font-size:.8rem;font-weight:600;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.5rem;display:block;}
    .search-wrapper{position:relative;}
    .search-icon{position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:#94a3b8;display:flex;pointer-events:none;}
    .search-clear{position:absolute;right:.875rem;top:50%;transform:translateY(-50%);color:#94a3b8;background:none;border:none;cursor:pointer;display:none;padding:.25rem;border-radius:4px;}
    .search-clear:hover{color:#64748b;}
    .name-input{width:100%;height:52px;padding:0 2.5rem 0 2.75rem;border:1.5px solid #e2e8f0;border-radius:12px;font-size:1rem;font-family:var(--font);background:white;outline:none;transition:all .2s;color:var(--text);}
    .name-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,0.1);}
    .search-hint{font-size:.75rem;color:var(--text-muted);margin-top:.5rem;}

    /* SEARCH RESULTS DROPDOWN */
    .results-dropdown{margin-top:.5rem;border:1.5px solid #e2e8f0;border-radius:12px;overflow:hidden;background:white;box-shadow:0 8px 24px rgba(0,0,0,0.08);display:none;}
    .results-dropdown.show{display:block;}
    .result-item{padding:.875rem 1rem;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:.75rem;border-bottom:1px solid #f1f5f9;}
    .result-item:last-child{border-bottom:none;}
    .result-item:hover{background:#f8fafc;}
    .result-avatar{width:36px;height:36px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-size:.875rem;font-weight:700;flex-shrink:0;}
    .result-name{font-weight:600;font-size:.9rem;}
    .result-meta{font-size:.75rem;color:var(--text-muted);}
    .result-status{margin-left:auto;flex-shrink:0;}
    .no-results{padding:1rem;text-align:center;color:var(--text-muted);font-size:.875rem;}

    /* BOOKING DETAIL CARD */
    .detail-card{background:var(--card-bg);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;box-shadow:var(--shadow);animation:slideUp .35s ease;display:none;}
    .detail-card.show{display:block;}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

    .detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;gap:1rem;flex-wrap:wrap;}
    .detail-name{font-size:1.25rem;font-weight:800;}
    .detail-ref{font-size:.72rem;color:var(--text-muted);font-family:'Inter',monospace;margin-top:.2rem;}
    .status-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .875rem;border-radius:20px;font-size:.78rem;font-weight:600;}
    .status-badge--pending{background:#fef3c7;color:#92400e;}
    .status-badge--completed{background:#d1fae5;color:#065f46;}
    .status-badge--scheduled{background:#e0e7ff;color:#3730a3;}
    .status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;}
    .status-badge--pending .status-dot{animation:blink 1.5s infinite;}
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

    .detail-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem;}
    .info-block{background:#f8fafc;border-radius:10px;padding:.75rem;}
    .info-block-label{font-size:.7rem;font-weight:600;color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.3rem;}
    .info-block-value{font-size:.875rem;font-weight:600;color:var(--text);}
    .info-block-value.mono{font-family:'Inter',monospace;font-size:.8rem;background:#e2e8f0;padding:.2rem .4rem;border-radius:4px;display:inline-block;}

    .detail-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1.25rem;}
    .tag{display:inline-flex;align-items:center;gap:.2rem;padding:.2rem .6rem;background:#f1f5f9;border-radius:6px;font-size:.72rem;color:#475569;}
    .tag--floor{background:#eff6ff;color:#1e40af;}
    .tag--backup{background:#f0fdf4;color:#065f46;}

    /* DIVIDER */
    .divider{border:none;border-top:1.5px solid #f1f5f9;margin:1.25rem 0;}

    /* STATUS STATES */
    .state-pending{text-align:center;padding:1.5rem;background:#fffbeb;border:1.5px solid #fde68a;border-radius:12px;}
    .state-pending-icon{font-size:2rem;margin-bottom:.5rem;}
    .state-pending h3{font-size:.95rem;font-weight:700;color:#78350f;margin-bottom:.25rem;}
    .state-pending p{font-size:.8rem;color:#92400e;}

    .state-scheduled{text-align:center;padding:1.5rem;background:#eef2ff;border:1.5px solid #c7d2fe;border-radius:12px;}
    .state-scheduled-icon{font-size:2rem;margin-bottom:.5rem;}
    .state-scheduled h3{font-size:.95rem;font-weight:700;color:#3730a3;margin-bottom:.25rem;}
    .state-scheduled-detail{font-size:.925rem;font-weight:700;color:#4338ca;margin-top:.5rem;}

    /* SCHEDULER */
    .scheduler{animation:slideUp .3s ease;}
    .scheduler-title{font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;}

    .date-section{margin-bottom:1.25rem;}
    .field-label{font-size:.78rem;font-weight:600;color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.5rem;display:block;}
    .date-input{width:100%;height:46px;padding:0 1rem;border:1.5px solid #e2e8f0;border-radius:10px;font-size:.95rem;font-family:var(--font);color:var(--text);background:white;outline:none;transition:all .2s;cursor:pointer;}
    .date-input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,0.12);}

    .time-section{margin-bottom:1.5rem;}
    .time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;}
    .time-btn{padding:.575rem .25rem;border:1.5px solid #e2e8f0;border-radius:8px;background:white;cursor:pointer;font-size:.8rem;font-family:var(--font);font-weight:500;color:var(--text-muted);transition:all .2s;text-align:center;}
    .time-btn:hover{border-color:var(--indigo);color:var(--indigo);background:#eef2ff;}
    .time-btn.selected{border-color:var(--indigo);background:var(--indigo);color:white;font-weight:700;}
    .time-btn:disabled{opacity:.35;cursor:not-allowed;background:#f8fafc;}

    /* SUBMIT BUTTON */
    .btn-confirm-appt{width:100%;height:52px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;font-size:1rem;font-family:var(--font);font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.5rem;}
    .btn-confirm-appt:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,0.4);}
    .btn-confirm-appt:active{transform:translateY(0);}
    .btn-confirm-appt:disabled{opacity:.65;cursor:not-allowed;transform:none;}

    /* SUCCESS SCREEN */
    .success-screen{text-align:center;padding:2rem;animation:slideUp .4s ease;display:none;}
    .success-screen.show{display:block;}
    .success-icon-wrap{width:80px;height:80px;background:linear-gradient(135deg,#10b981,#059669);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;}
    .success-title{font-size:1.25rem;font-weight:800;margin-bottom:.5rem;}
    .success-detail{font-size:.875rem;color:var(--text-muted);line-height:1.7;margin-bottom:1.5rem;}
    .success-appt-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.625rem 1.25rem;background:#eef2ff;border-radius:12px;font-size:.9rem;font-weight:700;color:#3730a3;margin-bottom:1.5rem;}
    .btn-new-search{padding:.75rem 1.5rem;border:1.5px solid #e2e8f0;border-radius:10px;background:white;cursor:pointer;font-size:.875rem;font-family:var(--font);font-weight:500;color:var(--text-muted);transition:all .2s;}
    .btn-new-search:hover{border-color:var(--primary);color:var(--primary);}

    /* TOAST */
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(10px);background:#1e293b;color:white;padding:.75rem 1.5rem;border-radius:12px;font-size:.875rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.2);opacity:0;transition:all .3s;z-index:2000;white-space:nowrap;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.success{background:linear-gradient(135deg,#10b981,#059669);}
    .toast.error{background:linear-gradient(135deg,#ef4444,#dc2626);}

    @keyframes spin{to{transform:rotate(360deg);}}
    .spin{animation:spin 1s linear infinite;}

    @media(max-width:600px){.detail-info-grid{grid-template-columns:1fr;}.time-grid{grid-template-columns:repeat(4,1fr);}.container{padding:1rem;}}
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="index.html">
        <div class="nav-logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="3" width="20" height="14" rx="2" stroke="white" stroke-width="2"/>
            <path d="M8 21h8M12 17v4" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="nav-title">IT Notebook Support</div>
          <div class="nav-subtitle">ระบบจองเปลี่ยน Notebook</div>
        </div>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">📋 จองเครื่อง</a>
        <a href="appointment.html" class="nav-link active">📅 นัดหมาย</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">📅 นัดหมายเปลี่ยน Notebook</h1>
      <p class="page-subtitle">ค้นหาชื่อ-นามสกุล แล้วเลือกวันและเวลาที่สะดวก</p>
    </div>

    <!-- Search Card -->
    <div class="search-card">
      <label class="search-label" for="name-search">ค้นหาชื่อผู้จอง</label>
      <div class="search-wrapper">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
            <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <input type="text" id="name-search" class="name-input" placeholder="พิมพ์ชื่อ-นามสกุล (ภาษาอังกฤษ)..." autocomplete="off" />
        <button class="search-clear" id="search-clear" aria-label="ล้างการค้นหา">✕</button>
      </div>
      <div class="search-hint">💡 พิมพ์อย่างน้อย 2 ตัวอักษรเพื่อค้นหา</div>

      <!-- Results Dropdown -->
      <div class="results-dropdown" id="results-dropdown"></div>
    </div>

    <!-- Booking Detail Card -->
    <div class="detail-card" id="detail-card">
      <!-- Header -->
      <div class="detail-header">
        <div>
          <div class="detail-name" id="d-name"></div>
          <div class="detail-ref" id="d-ref"></div>
        </div>
        <div id="d-status-badge"></div>
      </div>

      <!-- Info Grid -->
      <div class="detail-info-grid">
        <div class="info-block">
          <div class="info-block-label">📞 เบอร์มือถือ (ปิดบัง)</div>
          <div class="info-block-value" id="d-phone"></div>
        </div>
        <div class="info-block">
          <div class="info-block-label">🔒 รหัสเข้าเครื่อง (ปิดบัง)</div>
          <div class="info-block-value"><span class="mono" id="d-machine"></span></div>
        </div>
      </div>

      <div class="detail-tags" id="d-tags"></div>

      <hr class="divider"/>

      <!-- Dynamic section based on status -->
      <div id="status-section"></div>
    </div>

    <!-- Success Screen -->
    <div class="success-screen" id="success-screen">
      <div class="success-icon-wrap">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
          <path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="success-title">นัดหมายสำเร็จแล้ว! 🎉</h2>
      <div class="success-detail" id="success-detail"></div>
      <div class="success-appt-badge" id="success-appt-badge"></div>
      <br/>
      <button class="btn-new-search" id="btn-new-search">🔍 ค้นหารายการใหม่</button>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="appointment.js"></script>
</body>
</html>
